# FloBlur public release pipeline.
#
# Trigger:  push a tag like v1.0  (tag MUST equal MARKETING_VERSION in the
#           project — the job fails fast otherwise, so a mistag never ships).
# Output:   GitHub Release named by the tag, carrying:
#             - FloBlur-<ver>.dmg  (humans: drag into Applications)
#             - FloBlur-<ver>.zip  (Sparkle: in-app update with progress)
#           plus an updated appcast.xml committed back to main.
#
# Signing:  self-signed identity from repo secrets. No notarization step on
#           purpose: that needs a paid Apple Developer Program membership.
#           First open on other Macs = right-click > Open.
#           In-app updates are verified by Sparkle EdDSA signatures, which
#           need no Apple involvement at all.
#
# Secrets required (repo Settings > Secrets and variables > Actions):
#   MACOS_CERT_P12       base64 of the exported code-signing .p12
#   MACOS_CERT_PASSWORD  the .p12 export password
#   MACOS_CERT_NAME      signing identity name (e.g. FloBlur)
#   SPARKLE_ED_KEY       Sparkle Ed25519 private key (keychain item,
#                        account "ed25519": `security find-generic-password
#                        -a ed25519 -w` on the machine that ran generate_keys)

name: Release DMG

on:
  push:
    tags:
      - "v*"
  # Manual re-run without moving tags (e.g. resume after a late-step
  # failure). Same path, same guards — tag must exist and match the project.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.0)"
        required: true

concurrency:
  group: floblur-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Resolve tag
        id: version
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          RAW="${MANUAL_TAG:-$GITHUB_REF_NAME}"
          VER="${RAW#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: expected a release tag like v1.1" >&2
            exit 1
          fi
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "FLOBLUR_DERIVED_DATA_PATH=$RUNNER_TEMP/floblur-derived-data" >> "$GITHUB_ENV"

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install Sparkle tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          mkdir -p "$RUNNER_TEMP/sparkle-tools"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle-tools" ./bin/
          "$RUNNER_TEMP/sparkle-tools/bin/sign_update" --help >/dev/null

      - name: Build signed DMG
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_CERT_NAME }}
        run: |
          chmod +x Tools/build-dmg.sh
          ./Tools/build-dmg.sh "${{ steps.version.outputs.ver }}"

      - name: Build Sparkle update archive
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          APP="$FLOBLUR_DERIVED_DATA_PATH/Build/Products/Release/FloBlur.app"
          ditto -c -k --keepParent "$APP" "dist/FloBlur-$VER.zip"

      - name: Reject reused build numbers before publishing
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.ver }}
        run: |
          APP_INFO="$FLOBLUR_DERIVED_DATA_PATH/Build/Products/Release/FloBlur.app/Contents/Info.plist"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")"
          git fetch origin main
          git show FETCH_HEAD:appcast.xml > "$RUNNER_TEMP/current-appcast.xml"
          python3 Tools/update-appcast.py --check-build --feed "$RUNNER_TEMP/current-appcast.xml" \
            --tag "$TAG" --short-version "$VER" --build "$BUILD"

      - name: Verify the signed Sparkle archive before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.ver }}
        run: |
          NAME="FloBlur-$VER.zip"
          ZIP="$RUNNER_TEMP/verified-$NAME"
          if ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')" &&
             grep -Fqx -- "$NAME" <<< "$ASSETS"; then
            gh release download "$TAG" --pattern "$NAME" --output "$ZIP"
          else
            cp "dist/$NAME" "$ZIP"
          fi
          unzip -p "$ZIP" FloBlur.app/Contents/Info.plist > "$RUNNER_TEMP/published-info.plist"
          PUBLISHED_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/published-info.plist")"
          PUBLISHED_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/published-info.plist")"
          APP_INFO="$FLOBLUR_DERIVED_DATA_PATH/Build/Products/Release/FloBlur.app/Contents/Info.plist"
          EXPECTED_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")"
          if [[ "$PUBLISHED_VERSION" != "$VER" || "$PUBLISHED_BUILD" != "$EXPECTED_BUILD" ]]; then
            echo "ERROR: published bundle $PUBLISHED_VERSION ($PUBLISHED_BUILD) does not match $VER ($EXPECTED_BUILD)" >&2
            exit 1
          fi
          # Verify the signature with the same public key embedded in FloBlur.
          EDSIGNATURE="$(printf '%s\n' "$SPARKLE_ED_KEY" | "$RUNNER_TEMP/sparkle-tools/bin/sign_update" --ed-key-file - "$ZIP" -p | tr -d '[:space:]')"
          [ -n "$EDSIGNATURE" ] || { echo "ERROR: empty EdDSA signature from sign_update"; exit 1; }
          swift Tools/verify-update.swift "$ZIP" "$EDSIGNATURE" "$APP_INFO"
          echo "EDSIGNATURE=$EDSIGNATURE" >> "$GITHUB_ENV"
          echo "ZIPLENGTH=$(stat -f%z "$ZIP")" >> "$GITHUB_ENV"
          echo "PUBLISHED_BUILD=$PUBLISHED_BUILD" >> "$GITHUB_ENV"

      - name: Publish release assets without replacing existing downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.ver }}
        run: |
          DMG="FloBlur-$VER.dmg"
          ZIP="FloBlur-$VER.zip"
          if ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"; then
            for NAME in "$DMG" "$ZIP"; do
              if ! grep -Fqx -- "$NAME" <<< "$ASSETS"; then
                gh release upload "$TAG" "dist/$NAME"
              fi
            done
          else
            gh release create "$TAG" "dist/$DMG" "dist/$ZIP" --verify-tag \
              --title "FloBlur $VER" \
              --notes "Download $DMG and drag FloBlur into Applications."
          fi

      - name: Confirm the published archive matches the verified file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.ver }}
        run: |
          NAME="FloBlur-$VER.zip"
          gh release download "$TAG" --pattern "$NAME" --output "$RUNNER_TEMP/published-$NAME"
          cmp "$RUNNER_TEMP/verified-$NAME" "$RUNNER_TEMP/published-$NAME"

      - name: Update appcast and push back
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.ver }}
        run: |
          cp Tools/update-appcast.py "$RUNNER_TEMP/update-appcast.py"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git switch --detach FETCH_HEAD
            python3 "$RUNNER_TEMP/update-appcast.py" --feed appcast.xml --tag "$TAG" \
              --short-version "$VER" --build "$PUBLISHED_BUILD" \
              --repo "$GITHUB_REPOSITORY" \
              --asset-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/FloBlur-$VER.zip" \
              --length "$ZIPLENGTH" --edsig "$EDSIGNATURE"
            git add appcast.xml
            if git diff --cached --quiet; then
              echo "appcast already current on main."
              exit 0
            fi
            git commit -m "appcast: publish $TAG"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "appcast push attempt $attempt failed" >&2
          done
          echo "ERROR: appcast update could not be pushed" >&2
          exit 1
